[package]
name = "pcm-auto-decoder"
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
description = "Native PipeWire IEC-61937 detector/decoder with one stable adaptive PCM output"
repository = "https://github.com/k3rnL/pcm-auto-decoder"
publish = false

[dependencies]
anyhow = "1"
ffmpeg-next = { version = "8", default-features = false, features = ["format", "software-resampling"] }
clap = { version = "4", features = ["derive"] }
pipewire = { version = "0.10", features = ["v1_0_0"] }
spa_sys = { package = "libspa-sys", version = "0.10" }
crossbeam-channel = "0.5"
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
