name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu

    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (release)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cross build --release --target "${TARGET}"

      - name: Package artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # >>> CHANGE THIS if your binary name is different
          BIN_NAME="decoder"

          VERSION="${GITHUB_REF_NAME}"  # e.g. v1.2.3
          OUTDIR="dist"
          mkdir -p "${OUTDIR}"

          cp "target/${TARGET}/release/${BIN_NAME}" "${OUTDIR}/${BIN_NAME}"
          chmod +x "${OUTDIR}/${BIN_NAME}"

          TARBALL="${BIN_NAME}-${VERSION}-${TARGET}.tar.gz"
          tar -C "${OUTDIR}" -czf "${OUTDIR}/${TARBALL}" "${BIN_NAME}"

          (cd "${OUTDIR}" && sha256sum "${TARBALL}" > "${TARBALL}.sha256")

      - name: Generate release notes (git-cliff)
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: "release_notes.md"
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          files: |
            dist/*.tar.gz
            dist/*.sha256