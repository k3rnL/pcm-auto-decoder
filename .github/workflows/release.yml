name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs_on: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runs_on: ubuntu-24.04-arm

    runs-on: ${{ matrix.runs_on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ffmpeg-sys-next builds FFmpeg from source; on x86_64 it needs nasm for x86 asm.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm yasm pkg-config \
            make clang git perl python3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build (release)
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --release --target "${TARGET}"

      - name: Package artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          BIN_NAME="decoder"            # <-- change if needed
          VERSION="${GITHUB_REF_NAME}"  # e.g. v1.2.3
          OUTDIR="dist"
          mkdir -p "${OUTDIR}"

          cp "target/${TARGET}/release/${BIN_NAME}" "${OUTDIR}/${BIN_NAME}"
          chmod +x "${OUTDIR}/${BIN_NAME}"

          TARBALL="${BIN_NAME}-${VERSION}-${TARGET}.tar.gz"
          tar -C "${OUTDIR}" -czf "${OUTDIR}/${TARBALL}" "${BIN_NAME}"
          (cd "${OUTDIR}" && sha256sum "${TARBALL}" > "${TARBALL}.sha256")

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    name: create release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten dist folder
        shell: bash
        run: |
          mkdir -p release_dist
          find dist -type f -maxdepth 2 -print -exec cp -v {} release_dist/ \;

      - name: Generate release notes (git-cliff)
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: "release_notes.md"
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          files: |
            release_dist/*.tar.gz
            release_dist/*.sha256