name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Debian Trixie build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs_on: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runs_on: ubuntu-24.04-arm

    runs-on: ${{ matrix.runs_on }}
    container:
      image: rust:1.98.0-trixie
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Debian Trixie build and runtime dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils \
            ca-certificates \
            clang \
            file \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libclang-dev \
            libpipewire-0.3-dev \
            libswresample-dev \
            pkg-config \
            python3
          rm -rf /var/lib/apt/lists/*

      - name: Run locked tag gates
        shell: bash
        run: scripts/ci-gates.sh "${{ matrix.target }}" "${GITHUB_REF_NAME}"

      - name: Package target-qualified release archive
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git -c safe.directory="${GITHUB_WORKSPACE}" \
            show -s --format=%ct "${GITHUB_SHA}")
          scripts/package-release.sh \
            "${{ matrix.target }}" \
            "${GITHUB_REF_NAME}" \
            "target/${{ matrix.target }}/release/pcm-auto-decoder" \
            dist

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.provenance.json
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Download validated assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist

      - name: Assemble assets without filename collisions
        shell: bash
        run: |
          mkdir -p release_dist
          while IFS= read -r -d '' asset; do
            basename=$(basename "${asset}")
            if [[ -e "release_dist/${basename}" ]]; then
              echo "duplicate release asset name: ${basename}" >&2
              exit 1
            fi
            cp "${asset}" "release_dist/${basename}"
          done < <(find dist -type f -print0)
          test "$(find release_dist -type f -name '*.tar.gz' | wc -l)" -eq 2
          test "$(find release_dist -type f -name '*.sha256' | wc -l)" -eq 2
          test "$(find release_dist -type f -name '*.provenance.json' | wc -l)" -eq 2
          (cd release_dist && sha256sum --check ./*.sha256)

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: PCM Auto Decoder ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release_dist/*

  verify-published:
    name: Verify published Trixie asset (${{ matrix.target }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs_on: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    container:
      image: debian:trixie-slim
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Install minimum Trixie runtime and verification tools
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils \
            ca-certificates \
            coreutils \
            file \
            gh \
            git \
            gzip \
            libavcodec61 \
            libavformat61 \
            libavutil59 \
            libpipewire-0.3-0 \
            libswresample5 \
            python3 \
            tar
          rm -rf /var/lib/apt/lists/*

      - name: Checkout tag source for verification scripts
        uses: actions/checkout@v4

      - name: Download published release bytes
        shell: bash
        run: |
          mkdir downloaded
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir downloaded \
            --pattern 'pcm-auto-decoder-*'
          release_title=$(gh release view "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json name \
            --jq .name)
          test "${release_title}" = "PCM Auto Decoder ${GITHUB_REF_NAME}"

      - name: Verify downloaded target archive
        shell: bash
        run: scripts/verify-release-archive.sh downloaded "${{ matrix.target }}" "${GITHUB_REF_NAME}"
